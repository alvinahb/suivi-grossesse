<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi grossesse</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grossesse">
<meta name="theme-color" content="#fdf2f4">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg:#fdf2f4; --card:#fff; --text:#3a2a30; --muted:#8a7078; --accent:#d9668a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1619; --card:#2b2024; --text:#f5e9ed; --muted:#b39aa3; --accent:#f08cab; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system, system-ui, sans-serif; text-align:center;
    padding: calc(env(safe-area-inset-top) + 32px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  .card { background:var(--card); border-radius:24px; padding:28px 20px; max-width:420px; margin:0 auto 16px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
  .label { color:var(--muted); font-size:15px; margin:0 0 6px; }
  .big { font-size:44px; font-weight:700; margin:0; color:var(--accent); }
  .emoji { font-size:88px; line-height:1; margin:8px 0; }
  .fruit { font-size:24px; font-weight:600; margin:4px 0 0; }
  .size { font-size:20px; margin:12px 0 0; }
  .note { color:var(--muted); font-size:13px; margin:8px 0 0; }
  .dev { font-size:17px; line-height:1.4; margin:0; }
  .barre { height:10px; background:var(--bg); border-radius:5px; margin:16px 0 6px; overflow:hidden; }
  .barre div { height:100%; background:var(--accent); border-radius:5px; }
  .rdv { list-style:none; padding:0; margin:0; text-align:left; }
  .rdv li { padding:10px 0; border-bottom:1px solid var(--bg); }
  .rdv b { display:block; font-size:16px; }
  .rdv span { color:var(--muted); font-size:14px; }
  .rdv .badge { background:var(--accent); color:var(--card); font-size:12px; font-weight:600; padding:2px 8px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .prenoms { display:flex; gap:16px; text-align:left; }
  .prenoms div { flex:1; }
  .prenoms h2 { font-size:17px; margin:0 0 8px; color:var(--accent); text-align:center; }
  .prenoms ul { list-style:none; padding:0; margin:0; }
  .prenoms li { padding:6px 0; border-bottom:1px solid var(--bg); font-size:17px; }
</style>
</head>
<body>
  <div class="card">
    <p class="label">Aujourd'hui</p>
    <p class="big" id="sa">–</p>
    <div class="barre"><div id="barre"></div></div>
    <p class="note" id="trimestre"></p>
    <p class="note" id="total"></p>
  </div>
  <div class="card">
    <p class="label">Bébé est grand comme</p>
    <div class="emoji" id="emoji"></div>
    <p class="fruit" id="fruit"></p>
    <p class="size" id="size"></p>
    <p class="note" id="mesure"></p>
  </div>
  <div class="card">
    <p class="label">Cette semaine</p>
    <p class="dev" id="dev"></p>
  </div>
  <div class="card">
    <p class="label">Prochains rendez-vous</p>
    <ul class="rdv" id="rdv"></ul>
    <p class="note">+ une consultation prénatale chaque mois à partir du 4e mois</p>
  </div>
  <div class="card">
    <p class="label">Terme prévu (41 SA)</p>
    <p class="fruit" id="dpa"></p>
  </div>
  <div class="card">
    <p class="label">Idées de prénoms</p>
    <div class="prenoms">
      <div><h2>Garçon</h2><ul id="garcons"></ul></div>
      <div><h2>Fille</h2><ul id="filles"></ul></div>
    </div>
  </div>

<script>
// Premier jour des dernières règles (date d'aménorrhée)
const DDR = [2026, 9, 7]; // année, mois (1-12), jour
const TERME = 41 * 7; // en France, le terme est fixé à 41 SA

// Moyennes en début de semaine d'aménorrhée (SA) : taille (cm), poids (g), fruit, emoji, développement.
// Taille : jusqu'à 19 SA longueur tête-fesses ; à partir de 20 SA tête-talons.
const SEMAINES = {
  4:  [0.1,  0,    "une graine de pavot", "🌱", "L'œuf s'implante dans l'utérus et le placenta commence à se former."],
  5:  [0.2,  0,    "une graine de sésame", "🌱", "Le tube neural, futur cerveau et moelle épinière, se forme."],
  6:  [0.4,  0,    "une lentille", "🫘", "Le cœur commence à battre."],
  7:  [1.0,  0,    "une myrtille", "🫐", "Les bourgeons des bras et des jambes apparaissent."],
  8:  [1.6,  1,    "une framboise", "🍇", "Les traits du visage se dessinent : yeux, narines, oreilles."],
  9:  [2.3,  2,    "une cerise", "🍒", "Les doigts se séparent et les premiers petits mouvements apparaissent."],
  10: [3.1,  4,    "une fraise", "🍓", "Tous les organes principaux sont en place : l'embryon devient un fœtus."],
  11: [4.1,  7,    "une figue", "🟣", "Les os commencent à durcir et les ongles à pousser."],
  12: [5.4,  14,   "un citron vert", "🍋‍🟩", "Les premiers réflexes apparaissent : bébé ouvre et ferme les mains."],
  13: [7.4,  23,   "un kiwi", "🥝", "Les empreintes digitales se forment."],
  14: [8.7,  43,   "un citron", "🍋", "Bébé peut froncer les sourcils et sucer son pouce."],
  15: [10.1, 70,   "une pomme", "🍎", "Le squelette s'ossifie et les reins produisent de l'urine."],
  16: [11.6, 100,  "un avocat", "🥑", "Les muscles du visage permettent les premières grimaces."],
  17: [13.0, 140,  "une grenade", "🔴", "Un fin duvet, le lanugo, recouvre la peau."],
  18: [14.2, 190,  "un poivron", "🫑", "Les oreilles sont en place : bébé commence à percevoir les sons."],
  19: [15.3, 240,  "une mangue", "🥭", "Une crème protectrice, le vernix, recouvre la peau."],
  20: [25.6, 300,  "une banane", "🍌", "Les premiers mouvements peuvent commencer à se sentir."],
  21: [26.7, 360,  "une carotte", "🥕", "Bébé avale du liquide amniotique et entraîne son système digestif."],
  22: [27.8, 430,  "une papaye", "🧡", "Les sourcils et les cheveux sont visibles."],
  23: [28.9, 500,  "un pamplemousse", "🍊", "Bébé entend les voix et les bruits de l'extérieur."],
  24: [30.0, 600,  "un épi de maïs", "🌽", "Les poumons commencent à se préparer à respirer."],
  25: [34.6, 660,  "un chou-fleur", "🥦", "Bébé peut avoir le hoquet : de petits sursauts réguliers."],
  26: [35.6, 760,  "une laitue", "🥬", "Les yeux commencent à s'ouvrir."],
  27: [36.6, 875,  "un chou", "🥬", "Le cerveau se développe très vite ; bébé alterne sommeil et éveil."],
  28: [37.6, 1000, "une aubergine", "🍆", "Bébé cligne des yeux et réagit à la lumière."],
  29: [38.6, 1150, "une courge butternut", "🎃", "La graisse s'accumule sous la peau."],
  30: [39.9, 1320, "un concombre", "🥒", "Bébé prend maintenant environ 200 g par semaine."],
  31: [41.1, 1500, "une noix de coco", "🥥", "Les cinq sens fonctionnent."],
  32: [42.4, 1700, "une courge spaghetti", "🎃", "Les ongles atteignent le bout des doigts."],
  33: [43.7, 1920, "un ananas", "🍍", "Les os se renforcent, sauf ceux du crâne qui restent souples."],
  34: [45.0, 2150, "un melon", "🍈", "Le système immunitaire se renforce."],
  35: [46.2, 2380, "un melon miel", "🍈", "Bébé a moins de place et bouge différemment."],
  36: [47.4, 2620, "une laitue romaine", "🥬", "Bébé se place souvent la tête en bas."],
  37: [48.6, 2860, "une blette", "🥬", "Le lanugo disparaît peu à peu."],
  38: [49.8, 3080, "un poireau", "🥬", "Bébé s'entraîne à respirer et à téter."],
  39: [50.7, 3290, "une petite pastèque", "🍉", "Les poumons sont prêts : bébé est à terme."],
  40: [51.2, 3460, "une citrouille", "🎃", "Bébé est prêt et continue de prendre un peu de poids."],
  41: [51.5, 3600, "une pastèque", "🍉", "C'est le terme : la naissance peut arriver à tout moment."],
};

// Suivi médical en France : fenêtre [début, fin] en jours d'aménorrhée
const RDV = [
  [0,      14*7-1,  "1re consultation + déclaration de grossesse", "avant la fin du 3e mois"],
  [8*7,    20*7,    "Entretien prénatal précoce", "obligatoire, avec une sage-femme ou un médecin"],
  [11*7,   13*7+6,  "Échographie du 1er trimestre", "avec prise de sang de dépistage de la trisomie 21"],
  [20*7,   24*7+6,  "Échographie du 2e trimestre", "échographie morphologique"],
  [24*7,   28*7+6,  "Dépistage du diabète gestationnel", "si facteurs de risque"],
  [30*7,   34*7+6,  "Échographie du 3e trimestre", "croissance et position de bébé"],
  [33*7,   36*7+6,  "Consultation d'anesthésie", "obligatoire, même sans péridurale prévue"],
  [34*7,   37*7+6,  "Prélèvement streptocoque B", "prélèvement vaginal"],
  [TERME-42, TERME-42, "Début du congé maternité", "6 semaines avant le terme (1er ou 2e enfant)"],
];

const JOUR = 86400000;
// Dates en UTC pour éviter les décalages d'heure d'été
const utc = d => Date.UTC(d[0], d[1] - 1, d[2]);
const $ = id => document.getElementById(id);
const date = (jours, opts) => new Date(utc(DDR) + jours * JOUR).toLocaleDateString("fr-FR", { day: "numeric", month: "long", timeZone: "UTC", ...opts });

// ?date=AAAA-MM-JJ permet de simuler un autre jour
const param = new URLSearchParams(location.search).get("date");
const now = new Date();
const today = param ? param.split("-").map(Number) : [now.getFullYear(), now.getMonth() + 1, now.getDate()];

const jours = Math.round((utc(today) - utc(DDR)) / JOUR);
const sa = Math.floor(jours / 7), j = jours % 7;

$("sa").textContent = `${sa} SA` + (j ? ` + ${j} j` : "");
const pct = Math.min(100, Math.max(0, Math.round(jours / TERME * 100)));
$("barre").style.width = pct + "%";
$("trimestre").textContent = (sa < 15 ? "1er" : sa < 28 ? "2e" : "3e") + ` trimestre · ${pct} %`;
$("total").textContent = `${jours} jours d'aménorrhée · ${Math.max(0, TERME - jours)} jours avant le terme`;

const s = Math.min(Math.max(sa, 4), 41);
const v = SEMAINES[s], suivante = SEMAINES[s + 1];
// Interpolation linéaire vers la semaine suivante (sauf la taille au passage tête-fesses → tête-talons)
const interp = i => (sa >= 4 && sa < 41 && !(i === 0 && s === 19)) ? v[i] + (suivante[i] - v[i]) * j / 7 : v[i];
const taille = interp(0), poids = interp(1);
const virgule = (x, n) => x.toFixed(n).replace(".", ",");

$("emoji").textContent = v[3];
$("fruit").textContent = v[2];
$("size").textContent = (taille < 1 ? `≈ ${virgule(taille * 10, 0)} mm` : `≈ ${virgule(taille, 1)} cm`)
  + (s < 8 ? "" : poids < 1000 ? ` · ${virgule(poids, 0)} g` : ` · ${virgule(poids / 1000, 2)} kg`);
$("mesure").textContent = s < 20 ? "longueur tête-fesses" : "longueur tête-talons";
$("dev").textContent = v[4];

// Rendez-vous pas encore passés : les 3 prochains
for (const [de, a, titre, note] of RDV.filter(r => r[1] >= jours).slice(0, 3)) {
  const li = $("rdv").appendChild(document.createElement("li"));
  const quand = de === a ? `le ${date(de)}` : `du ${date(de)} au ${date(a)}`;
  li.innerHTML = `<b></b><span></span>`;
  li.firstChild.textContent = titre;
  if (de <= jours) li.firstChild.insertAdjacentHTML("beforeend", `<span class="badge">en cours</span>`);
  li.lastChild.textContent = `${quand} · ${note}`;
}

$("dpa").textContent = date(TERME, { year: "numeric" });

// Prénoms : un par ligne dans garcons.txt / filles.txt
for (const id of ["garcons", "filles"]) {
  const ul = $(id);
  fetch(id + ".txt", { cache: "no-store" })
    .then(r => r.ok ? r.text() : "")
    .catch(() => "")
    .then(txt => {
      const noms = txt.split("\n").map(n => n.trim()).filter(Boolean);
      if (!noms.length) noms.push("—");
      for (const n of noms) ul.appendChild(document.createElement("li")).textContent = n;
    });
}

// Hors connexion
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
